<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>盤點系統</title>
<meta name="theme-color" content="#1B2220">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="盤點系統">

<style>
:root{
  --bg:#F3F5F4; --card:#FFFFFF; --ink:#1B2220; --muted:#5D6864; --line:#D6DCD9; --strong:#9AA5A0;
  --store:#C2552F; --store-bg:#FBEDE7; --lead:#2F62C8; --lead-bg:#E8EFFB; --owner:#1E8A5E; --owner-bg:#E3F4EC;
  --done:#2E7D32; --bad:#B3261E; --bad-bg:#FBE9E7; --focus:#2F62C8;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121715; --card:#1B2220; --ink:#E6ECE9; --muted:#A2ADA8; --line:#33403A; --strong:#5E6B65;
  --store:#F09A78; --store-bg:#3A2820; --lead:#8DB0F2; --lead-bg:#1F2A40; --owner:#6FD0A4; --owner-bg:#1B3329;
  --done:#7FD186; --bad:#F2867E; --bad-bg:#3A2020; --focus:#8DB0F2;
}}
*{box-sizing:border-box}
body{margin:0;padding-top:env(safe-area-inset-top,0px);background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:16px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px 120px}
h1{font-size:22px;margin:4px 0 14px} h2{font-size:17px;margin:22px 0 8px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:14px;color:var(--muted)}
.bar b{color:var(--ink);font-size:16px}
.bar .sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;border:1.5px solid var(--strong);background:var(--card);padding:10px 16px;min-height:44px;cursor:pointer;font-weight:500;white-space:nowrap;flex-shrink:0}
.btn.primary{background:var(--ink);color:var(--card);border-color:var(--ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn.small{min-height:34px;padding:4px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px 0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
label.f{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
input[type=text],input[type=number],input[type=password],input[type=search],select,textarea{width:100%;border:1px solid var(--strong);border-radius:8px;padding:9px 10px;background:var(--card);min-height:44px}
textarea{min-height:90px;resize:vertical}
.case{display:block;width:100%;text-align:left;cursor:pointer;border-left:5px solid var(--strong)}
.case.門市{border-left-color:var(--store)} .case.盤點長{border-left-color:var(--lead)} .case.老闆{border-left-color:var(--owner)}
.case .t{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.case .id{font-weight:700}
.case .m{color:var(--muted);font-size:14px}
.chip{display:inline-block;border-radius:999px;padding:1px 10px;font-size:13px;font-weight:500;border:1.5px solid var(--strong);color:var(--muted)}
.chip.門市{color:var(--store);border-color:var(--store);background:var(--store-bg)}
.chip.盤點長{color:var(--lead);border-color:var(--lead);background:var(--lead-bg)}
.chip.老闆{color:var(--owner);border-color:var(--owner);background:var(--owner-bg)}
.chip.done{color:var(--done);border-color:var(--done)}
.late{color:var(--bad);font-weight:700}
.empty{color:var(--muted);font-size:15px;margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left}
th{font-size:13px;color:var(--muted);font-weight:500;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.items-edit .item{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:var(--bg)}
.items-edit .item.main{border-color:var(--store);border-width:1.5px}
.items-edit .ihead{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:14px;font-weight:500}
.items-edit .ihead .sp{flex:1}
.items-edit .g2{display:grid;grid-template-columns:5.2em minmax(0,1fr) minmax(0,1fr);gap:6px;margin-bottom:6px}
.items-edit select{min-height:42px;padding:8px 6px}
.q{border-radius:6px;padding:1px 6px;font-weight:600;color:#1B2220;display:inline-block}
.q.a{background:#F4CCCC}.q.b{background:#B7E8B0}.q.c{background:#B5EEF2}
.items-edit .g3 input.qa{border-color:#D99A9A;background:#FCEEEE}.items-edit .g3 input.qb{border-color:#7FC676;background:#EBF8E8}.items-edit .g3 input.qc{border-color:#6CCBD3;background:#E7FAFB}
.qnote{font-size:12.5px;color:var(--muted);margin:8px 2px 0;line-height:1.6}
th .q{font-size:12px}
table.items td.n,table.items th.n{text-align:center}
table.items tr.nm td{border-bottom:0;padding-bottom:0;padding-top:10px}
.items-edit .g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.items-edit .lab{font-size:12px;color:var(--muted);display:block;margin-bottom:2px}
.items-edit .ihead label{display:flex;align-items:center;gap:6px;cursor:pointer}
.items-edit input[type=number]{-moz-appearance:textfield;text-align:center}
.items-edit input[type=number]::-webkit-inner-spin-button,.items-edit input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.btn .rt{font-size:12px;font-weight:400;opacity:.75}
.items-edit .head{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.items-edit input{padding:8px 6px;min-height:42px}
.items-edit input[type=radio]{min-height:auto;width:20px;height:20px}
.x{background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:8px}
.ph{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--line);border:0;padding:0;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .rm{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:26px;height:26px;cursor:pointer}
.pgroup{margin-top:12px}
.pgroup h3{font-size:14px;margin:0;color:var(--muted);font-weight:500}
.pgroup h3 em{color:var(--bad);font-style:normal}
.file{display:inline-flex;margin-top:6px}
.file input{position:absolute;opacity:0;width:1px;height:1px}
.tl{list-style:none;padding:0;margin:0}
.tl li{border-left:2px solid var(--line);padding:0 0 14px 14px;position:relative}
.tl li::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--strong)}
.tl .w{font-size:13px;color:var(--muted)}
.tl p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.notice{background:var(--lead-bg);border:1px solid var(--lead);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.notice.warn{background:var(--store-bg);border-color:var(--store)}
.actions{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.actions .btn{flex:1 1 140px;max-width:240px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.sheet h2{margin-top:0}
.sheet .row2{display:flex;gap:8px;margin-top:16px}
.sheet .row2 .btn{flex:1}
.lightbox{align-items:center;background:rgba(0,0,0,.85)}
.lightbox img{max-width:96vw;max-height:88vh;border-radius:6px}
.busy{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:30}
.busy div{background:var(--card);padding:16px 22px;border-radius:12px;font-weight:500}
.leadbar{display:flex;align-items:center;gap:10px;background:var(--lead);color:#fff;border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:14.5px}
.leadbar b{font-weight:700}.leadbar .sp{flex:1}.leadbar button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:5px 12px;cursor:pointer;font-weight:500}
.next{margin-top:18px}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{border:1.5px solid var(--line);background:var(--bg);color:var(--muted);border-radius:10px;padding:9px 14px;min-height:44px;cursor:pointer;font-weight:500}
.choice[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.choice.danger[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.actform{margin-top:12px;border-top:1px solid var(--line);padding-top:4px}
.progress{display:inline-block;font-size:13px;color:var(--lead);font-weight:500;margin-left:6px}
.login{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}
.login .box{max-width:360px;width:100%;text-align:center}
.login p{color:var(--muted)}
#dcode{text-align:center;letter-spacing:.08em;margin-top:14px}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:10px;z-index:40;max-width:92vw}
.toast.err{background:var(--bad);color:#fff}
.err-text{color:var(--bad);font-size:14px;margin-top:8px}
dl.info{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:15px}
dl.info dt{color:var(--muted)} dl.info dd{margin:0}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="empty">載入中…</p></div>
<script>
window.onerror = function(msg, src, line){
  var el = document.getElementById('app');
  if(el) el.innerHTML = '\x3Ch1>盤點系統\x3C/h1>\x3Cdiv class="notice warn">畫面載入時發生錯誤：' + String(msg).replace(/\x3C/g,'&lt;') + '（第 ' + line + ' 行）。請把這段文字傳給負責系統的人。\x3C/div>';
};
</script>
<script>
// ===== 設定：部署後填入這兩個值 =====
const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbzOxwYd4IyOH926YWIQYx4Oc7O6aV1EEMzMadR5I41IuxIkIuUwxX02p4Qos0Afy8Jv/exec';        // 後台網頁應用程式網址（/exec 結尾）
// =====================================
const DEEP_CASE = (new URLSearchParams(location.search).get('case') || '').replace(/[^A-Za-z0-9\-]/g, '');
const S = { home: null, draft: null, lead: null, view: null };
// 盤點長／老闆登入：只存在這次開啟的 App 裡；30 分鐘沒有操作就自動登出
const LEAD_IDLE_MS = 30 * 60 * 1000;
let lastActive = Date.now();
try { const l = JSON.parse(sessionStorage.getItem('inv_lead') || 'null'); if(l) S.lead = l; } catch(e){}
['click', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { lastActive = Date.now(); }, { passive: true }));
setInterval(() => { if(S.lead && Date.now() - lastActive > LEAD_IDLE_MS){ leadLogout(true); } }, 30000);
const $app = document.getElementById('app');

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pad(n){ return String(n).padStart(2, '0'); }
function when(iso){ if(!iso) return ''; const d = new Date(iso); return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function day(iso){ if(!iso) return ''; const d = new Date(iso); return `${d.getMonth()+1}/${d.getDate()}`; }
function signed(n){ n = Number(n) || 0; return n > 0 ? '+' + n : String(n); }

/* ---------- 裝置碼 ---------- */
// 每間店一組裝置碼；店內裝置第一次使用時輸入，之後記在這台裝置上
let deviceCode = null, waiters = [], loginEl = null, lastAuthError = '';
try { deviceCode = localStorage.getItem('inv_device'); } catch(e){}
// 這台裝置的隨機識別碼：第一次產生後一直保留，用來綁定裝置碼
let deviceId = null;
try { deviceId = localStorage.getItem('inv_device_id'); } catch(e){}
if(!deviceId){
  const a = new Uint8Array(16); crypto.getRandomValues(a);
  deviceId = 'd-' + Array.from(a, b => b.toString(16).padStart(2, '0')).join('');
  try { localStorage.setItem('inv_device_id', deviceId); } catch(e){}
}
async function post(code, fn, args){
  if(BACKEND_URL.indexOf('PASTE_') === 0) throw new Error('index.html 還沒填入後台網址（BACKEND_URL），請通知負責人');
  const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), 60000);
  let res;
  try {
    res = await fetch(BACKEND_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ deviceCode: code, deviceId, fn, args }), signal: ctrl.signal });
  } catch(e){
    throw new Error(e.name === 'AbortError' ? '後台超過 60 秒沒有回應，請稍後再試' : '連不到後台，請確認網路，或 BACKEND_URL 是否正確');
  } finally { clearTimeout(timer); }
  const text = await res.text();
  try { return JSON.parse(text); }
  catch(e){
    const brief = text.replace(/\x3C[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 80);
    throw new Error('後台回傳的不是資料（狀態碼 ' + res.status + '）：' + brief);
  }
}
function showLogin(msg){
  if(loginEl) return;
  loginEl = document.createElement('div'); loginEl.className = 'login';
  loginEl.innerHTML = `\x3Cdiv class="box">\x3Ch1>盤點系統\x3C/h1>\x3Cp>請輸入本店的裝置碼。\x3Cbr>這台裝置之後會記住，不用再輸入。\x3C/p>
    \x3Cinput type="password" id="dcode" autocomplete="off" aria-label="裝置碼">
    \x3Cdiv class="err-text" id="derr">${esc(msg || '')}\x3C/div>
    \x3Cbutton class="btn primary block" id="dgo" style="margin-top:12px">確定\x3C/button>\x3C/div>`;
  document.body.appendChild(loginEl);
  const input = document.getElementById('dcode'), err = document.getElementById('derr'), go = document.getElementById('dgo');
  const submit = async () => {
    const code = input.value.trim();
    if(!code){ err.textContent = '請輸入裝置碼'; return; }
    go.disabled = true; err.textContent = '確認中…';
    try {
      const out = await post(code, 'getHome', []);
      if(!out.ok){ err.textContent = out.error || '裝置碼不正確'; go.disabled = false; return; }
      deviceCode = code; try { localStorage.setItem('inv_device', code); } catch(e){}
      loginEl.remove(); loginEl = null;
      const ws = waiters; waiters = []; ws.forEach(r => r(code));
    } catch(e){ err.textContent = e.message; go.disabled = false; }
  };
  go.onclick = submit;
  input.onkeydown = e => { if(e.key === 'Enter') submit(); };
  input.focus();
}
function ensureDevice(msg){
  if(deviceCode) return Promise.resolve(deviceCode);
  return new Promise(resolve => { waiters.push(resolve); showLogin(msg); });
}
function resetDevice(){
  deviceCode = null; try { localStorage.removeItem('inv_device'); } catch(e){}
  S.home = null; ensureDevice().then(() => openHome());
}

/* ---------- 呼叫後台 ---------- */
async function call(fn, ...args){
  for(let attempt = 0; attempt < 2; attempt++){
    if(!deviceCode){
      const hadBusy = busyEl ? busyEl.firstChild.textContent : '';
      busy(); await ensureDevice(attempt ? (lastAuthError || '裝置碼已失效，請向負責人取得新的裝置碼') : '');
      if(hadBusy) busy(hadBusy);
    }
    const out = await post(deviceCode, fn, args);
    if(out.ok) return out.data;
    if(out.session){ clearLead(); refreshView(); throw new Error(out.error || '盤點長登入已逾時，請重新登入'); }
    if(out.auth && attempt === 0){ lastAuthError = out.error; deviceCode = null; try { localStorage.removeItem('inv_device'); } catch(e){} continue; }
    throw new Error(out.error || '發生錯誤');
  }
}
let busyEl = null;
function busy(text){
  if(!text){ if(busyEl){ busyEl.remove(); busyEl = null; } return; }
  if(!busyEl){ busyEl = document.createElement('div'); busyEl.className = 'busy'; busyEl.innerHTML = '\x3Cdiv>\x3C/div>'; document.body.appendChild(busyEl); }
  busyEl.firstChild.textContent = text;
}
function toast(msg, err){
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), err ? 5000 : 2500);
}
function shrink(img, max, q){
  const s = Math.min(1, max / Math.max(img.width, img.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  return cv.toDataURL('image/jpeg', q);
}
function makeImages(file){
  return new Promise((resolve, reject) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { const r = { full: shrink(img, 1600, 0.8), thumb: shrink(img, 320, 0.7) }; URL.revokeObjectURL(url); resolve(r); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('無法讀取這張照片')); };
    img.src = url;
  });
}
function lightbox(src){
  const o = document.createElement('div'); o.className = 'overlay lightbox';
  o.innerHTML = `\x3Cimg src="${esc(src)}" alt="照片放大">`; o.onclick = () => o.remove(); document.body.appendChild(o);
}
async function openPhoto(id, thumb){
  lightbox(thumb);
  try { const full = await call('getPhoto', id); const img = document.querySelector('.lightbox img'); if(img) img.src = full; }
  catch(e){ toast(e.message, true); }
}
function fatal(msg){
  $app.innerHTML = `\x3Ch1>盤點系統\x3C/h1>\x3Cdiv class="notice warn">${esc(msg)}\x3C/div>\x3Cbutton class="btn" id="retry">重新載入\x3C/button>`;
  document.getElementById('retry').onclick = openHome;
}
function topBar(back){
  const a = S.home && S.home.account;
  const who = a ? (a.device || (a.store === '全部' ? '管理帳號' : a.store)) : '';
  const bar = `\x3Cdiv class="bar">${back ? '\x3Cbutton class="btn small" id="back">← 返回\x3C/button>' : ''}\x3Cspan class="sp">\x3C/span>\x3Cspan>\x3Cb>${esc(who)}\x3C/b>\x3C/span>${S.lead ? '' : '\x3Cbutton class="link" id="leadin">盤點長／老闆登入\x3C/button>'}${back ? '' : '\x3Cbutton class="link" id="signout">重設裝置碼\x3C/button>'}\x3C/div>`;
  const lb = S.lead ? `\x3Cdiv class="leadbar">\x3Cspan>${esc(S.lead.role)}模式：\x3Cb>${esc(S.lead.name)}\x3C/b>\x3C/span>\x3Cspan class="sp">\x3C/span>\x3Cbutton id="leadout">登出\x3C/button>\x3C/div>` : '';
  return bar + lb;
}
function bindTop(back){
  const b = document.getElementById('back'); if(b) b.onclick = back;
  const so = document.getElementById('signout'); if(so) so.onclick = () => { if(confirm('要清除這台裝置的裝置碼嗎？清除後需要重新輸入。')) resetDevice(); };
  const li = document.getElementById('leadin'); if(li) li.onclick = leadLogin;
  const lo = document.getElementById('leadout'); if(lo) lo.onclick = () => leadLogout(false);
}
function refreshView(){
  if(S.view && S.view.type === 'case') openCase(S.view.id); else if(S.home) renderHome();
}
function clearLead(){ S.lead = null; try { sessionStorage.removeItem('inv_lead'); } catch(e){} }
function leadLogin(){
  const o = document.createElement('div'); o.className = 'overlay';
  o.innerHTML = `\x3Cdiv class="sheet" role="dialog" aria-label="盤點長／老闆登入">\x3Ch2>盤點長／老闆登入\x3C/h2>
    \x3Cp class="empty">登入後，這台裝置會顯示盤點長（或老闆）的操作，送出時不用再輸入代碼和密碼。30 分鐘沒有操作、或關掉 App，就會自動登出。\x3C/p>
    \x3Cdiv style="display:flex;gap:8px">\x3Cdiv style="flex:1">\x3Clabel class="f" for="lcode">人員代碼\x3C/label>\x3Cinput type="text" id="lcode" autocomplete="off" autocapitalize="characters">\x3C/div>

function ask(opt){
  return new Promise(resolve => {
    const fields = opt.fields || [];
    const o = document.createElement('div'); o.className = 'overlay';
    o.innerHTML = `\x3Cdiv class="sheet" role="dialog" aria-label="${esc(opt.title)}">\x3Ch2>${esc(opt.title)}\x3C/h2>
      ${opt.text ? `\x3Cp>${esc(opt.text)}\x3C/p>` : ''}
      ${fields.map((f, i) => `\x3Clabel class="f" for="af${i}">${esc(f.label)}\x3C/label>${f.multiline ? `\x3Ctextarea id="af${i}">\x3C/textarea>` : `\x3Cinput type="text" id="af${i}">`}`).join('')}
      \x3Cdiv style="display:flex;gap:8px">
        \x3Cdiv style="flex:1">\x3Clabel class="f" for="acode">你的人員代碼\x3C/label>\x3Cinput type="text" id="acode" autocomplete="off" autocapitalize="characters">\x3C/div>
        ${opt.needPin ? `\x3Cdiv style="flex:1">\x3Clabel class="f" for="apin">密碼\x3C/label>\x3Cinput type="password" id="apin" autocomplete="off">\x3C/div>` : ''}
      \x3C/div>
      \x3Cdiv class="err-text" id="aerr">\x3C/div>
      \x3Cdiv class="row2">\x3Cbutton class="btn" id="acancel">取消\x3C/button>\x3Cbutton class="btn ${opt.danger ? 'danger' : 'primary'}" id="aok">${esc(opt.okLabel || '確定')}\x3C/button>\x3C/div>\x3C/div>`;
    document.body.appendChild(o);
    const close = v => { o.remove(); resolve(v); };
    o.onclick = e => { if(e.target === o) close(null); };
    document.getElementById('acancel').onclick = () => close(null);
    document.getElementById('aok').onclick = async () => {
      const values = {};
      for(let i = 0; i < fields.length; i++){
        const v = document.getElementById('af' + i).value.trim();
        if(fields[i].required && !v){ document.getElementById('aerr').textContent = `請填寫「${fields[i].label}」`; return; }
        values[fields[i].key] = v;
      }
      const code = document.getElementById('acode').value.trim();
      if(!code){ document.getElementById('aerr').textContent = '請輸入你的人員代碼'; return; }
      const pin = opt.needPin ? document.getElementById('apin').value.trim() : '';
      if(opt.run){
        busy('處理中…');
        try { await opt.run(values, code, pin); busy(); close({ values, code, pin }); }
        catch(e){ busy(); document.getElementById('aerr').textContent = e.message; }
      } else close({ values, code, pin });
    };
    const first = o.querySelector('textarea,input'); if(first) first.focus();
  });
}

async function submitNew(){
  const err = document.getElementById('nerr'); err.textContent = '';
  const storeEl = document.getElementById('store');
  const data = {
    code: document.getElementById('code').value.trim(),
    scene: document.getElementById('scene').value, store: storeEl ? storeEl.value : '',
    note: document.getElementById('note').value.trim(),
    items: Array.from(document.querySelectorAll('#rows .item')).map(r => {
      const sel = r.querySelector('.brand').value;
      return {
        main: r.querySelector('input[type=radio]').checked, sku: r.querySelector('.sku').value.trim(),
        brand: sel === '__other' ? r.querySelector('.brand-other').value.trim() : sel,
        model: r.querySelector('.model').value.trim(), spec: r.querySelector('.spec').value.trim(),
        sys: r.querySelector('.qa').value, paper: r.querySelector('.qb').value, stock: r.querySelector('.qc').value
      };
    }).filter(it => it.sku || it.brand || it.model || it.spec || it.sys || it.paper || it.stock)
  };
  if(!data.code){ err.textContent = '請輸入你的人員代碼'; return; }
  if(!data.scene){ err.textContent = '請選發現情境'; return; }
  if(storeEl && !data.store){ err.textContent = '請選分店'; return; }
  if(!data.items.length){ err.textContent = '至少要填一個品項'; return; }
  for(let i = 0; i < data.items.length; i++){
    const it = data.items[i], n = '品項 ' + (i + 1);
    if(!it.sku){ err.textContent = n + '的商品編碼要填'; return; }
    if(!it.brand){ err.textContent = n + '的廠牌要選擇或填入'; return; }
    if(!it.model){ err.textContent = n + '的型號要填'; return; }
    if(!it.spec){ err.textContent = n + '的品名、顏色、尺寸要填'; return; }
    if(it.sys === '' || it.paper === '' || it.stock === ''){ err.textContent = n + '的 (A) 系統、(B) 紙本、(C) 現貨數量都要填數字'; return; }
  }
  if(!S.draft.photos.some(p => p.type === '紙本頁面')){ err.textContent = '至少要拍一張紙本頁面'; return; }
  let id = null;
  try {
    busy('建立盤點單…'); id = await call('createCase', data);
    const ps = S.draft.photos;
    for(let i = 0; i < ps.length; i++){ busy(`上傳照片 ${i + 1}／${ps.length}…`); await call('uploadPhoto', id, data.code, ps[i].type, ps[i].full, ps[i].thumb); }
    busy('送出中…'); await call('finalizeCase', id, data.code);
    busy(); renderSubmitted(id, data.code);
  } catch(e){
    busy();
    if(id){ toast('照片沒有全部上傳成功，盤點單已存成草稿，請在案件頁補上照片再送出。', true); openCase(id); }
    else err.textContent = e.message;
  }
}

      ${c.note ? `\x3Cdt>備註\x3C/dt>\x3Cdd style="white-space:pre-wrap">${esc(c.note)}\x3C/dd>` : ''}
    \x3C/dl>\x3C/div>
    \x3Ch2>可能誤差的品項\x3C/h2>\x3Cdiv class="card" style="overflow-x:auto">\x3Ctable class="items">\x3Cthead>\x3Ctr>\x3Cth class="n">\x3Cspan class="q a">(A) 系統\x3C/span>\x3C/th>\x3Cth class="n">\x3Cspan class="q b">(B) 紙本\x3C/span>\x3C/th>\x3Cth class="n">\x3Cspan class="q c">(C) 現貨\x3C/span>\x3C/th>\x3Cth class="n">差異\x3C/th>\x3C/tr>\x3C/thead>
      \x3Ctbody>${d.items.map(it => `\x3Ctr class="nm">\x3Ctd colspan="4">${it.main ? '★ ' : ''}\x3Cb>${esc([it.brand, it.model].filter(Boolean).join(' '))}\x3C/b> ${esc(it.spec)}${it.sku ? `　\x3Cspan class="empty" style="font-size:12.5px">商品編碼 ${esc(it.sku)}\x3C/span>` : ''}\x3C/td>\x3C/tr>\x3Ctr>\x3Ctd class="n">${esc(it.sys)}\x3C/td>\x3Ctd class="n">${esc(it.paper)}\x3C/td>\x3Ctd class="n">${esc(it.stock)}\x3C/td>\x3Ctd class="n">\x3Cb>${signed(it.diff)}\x3C/b>\x3C/td>\x3C/tr>`).join('')}\x3C/tbody>\x3C/table>
      \x3Cp class="qnote">\x3Cspan class="q a">(A)\x3C/span> 系統數量＝線上系統　\x3Cspan class="q b">(B)\x3C/span> 紙本數量＝存貨本　\x3Cspan class="q c">(C)\x3C/span> 現貨數量＝實際點到\x3Cbr>差異＝(C) 現貨 − (A) 系統；正數表示現貨比系統多。\x3C/p>\x3C/div>
    \x3Ch2>照片（${d.photos.length}）\x3C/h2>\x3Cdiv class="card">
      ${groups.length ? groups.map(([t, l]) => `\x3Cdiv class="pgroup">\x3Ch3>${esc(t)}（${l.length}）\x3C/h3>\x3Cdiv class="photos">${l.map(p => `\x3Cbutton class="ph" data-photo="${esc(p.id)}" aria-label="放大照片">\x3Cimg src="${esc(p.thumb)}" alt="">\x3C/button>`).join('')}\x3C/div>\x3C/div>`).join('') : '\x3Cp class="empty">還沒有照片。\x3C/p>'}
      ${final ? '' : `\x3Cdiv class="pgroup">\x3Ch3>加照片\x3C/h3>\x3Cdiv style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px">
        \x3Cselect id="ptype" style="width:auto">${d.photoTypes.map(t => `\x3Coption ${t === defaultPhotoType(c.status) ? 'selected' : ''}>${esc(t)}\x3C/option>`).join('')}\x3C/select>
        \x3Clabel class="btn small file">＋ 拍照或選照片\x3Cinput type="file" accept="image/*" multiple id="pfile">\x3C/label>\x3C/div>\x3C/div>`}
    \x3C/div>
    \x3Ch2>處理紀錄\x3C/h2>\x3Cdiv class="card">\x3Cul class="tl">${d.events.map(e => `\x3Cli>\x3Cdiv class="w">${when(e.at)}・${esc(e.by)}${e.device ? '・' + esc(e.device) : ''}\x3C/div>\x3Cb>${esc(e.action)}\x3C/b>${e.to && e.to !== e.from ? `\x3Cspan class="empty">　→ ${esc(e.to)}\x3C/span>` : ''}${e.content ? `\x3Cp>${esc(e.content)}\x3C/p>` : ''}\x3C/li>`).join('')}\x3C/ul>\x3C/div>
    \x3Cp>\x3Cbutton class="link" id="reload">重新整理\x3C/button>\x3C/p>
    ${draft ? `\x3Cdiv class="actions">\x3Cbutton class="btn primary" id="finalize">送出盤點單\x3C/button>\x3C/div>` : final ? '' : nextStepHtml(c, d)}`;
  bindTop(() => openHome());
  document.getElementById('reload').onclick = () => openCase(c.id);
  $app.querySelectorAll('[data-photo]').forEach(b => b.onclick = () => openPhoto(b.dataset.photo, b.querySelector('img').src));

  const paper = document.getElementById('paper');
  if(paper) paper.onclick = async () => {
    const r = await ask({ title: '紙本已修改', text: '確認紙本存貨本已經改成與現貨一致。', okLabel: '確認', run: (v, code) => call('markPaperDone', c.id, code) });
    if(r) openCase(c.id);
  };

  const pfile = document.getElementById('pfile');
  if(pfile) pfile.onchange = async () => {
    const files = Array.from(pfile.files || []); if(!files.length) return;
    const type = document.getElementById('ptype').value;
    const r = await ask({ title: `上傳 ${files.length} 張「${type}」照片`, okLabel: '上傳' });
    if(!r){ pfile.value = ''; return; }
    try {
      for(let i = 0; i < files.length; i++){
        busy(`上傳照片 ${i + 1}／${files.length}…`);
        const im = await makeImages(files[i]);
        await call('uploadPhoto', c.id, r.code, type, im.full, im.thumb);
      }
      busy(); toast('照片已上傳');
    } catch(e){ busy(); toast(e.message, true); }
    openCase(c.id);
  };

  const fin = document.getElementById('finalize');
  if(fin) fin.onclick = async () => {
    const r = await ask({ title: '送出盤點單', okLabel: '送出', run: (v, code) => call('finalizeCase', c.id, code) });
    if(r) renderSubmitted(c.id, r.code);
  };

  bindNextStep(c, d);
}

/* ---------- 下一步：先選擇、再填寫、最後送出 ---------- */
function canDo(role){
  if(role === '門市') return !S.lead;
  if(!S.lead) return false;
  if(role === '盤點長') return S.lead.role === '盤點長' || S.lead.role === '老闆';
  if(role === '老闆') return S.lead.role === '老闆';
  return false;
}
function visibleActions(d){ return d.actions.filter(a => canDo(a.role)); }
function nextStepHtml(c, d){
  const acts = visibleActions(d);
  let hint = '';
  if(!acts.length){
    if(!S.lead && c.stage !== '門市') hint = `目前等待${esc(c.stage)}處理。${esc(c.stage)}請按右上角「盤點長／老闆登入」後操作。`;
    else if(S.lead && c.stage === '門市') hint = '目前輪到門市處理，請登出盤點長模式後，由門市同仁操作。';
    else hint = '目前沒有可以執行的動作。';
    return `\x3Cdiv class="card next">\x3Ch2 style="margin-top:0">下一步\x3C/h2>\x3Cp class="empty">${hint}\x3C/p>\x3C/div>`;
  }
  const leadHub = S.lead && c.stage === '盤點長' && !acts.some(a => a.key === 'close');
  return `\x3Cdiv class="card next">\x3Ch2 style="margin-top:0">下一步\x3C/h2>
    \x3Cp class="empty" style="margin-top:0">請先選擇要做的事，填寫後按「送出」。${leadHub ? '門市複點一致之後，這裡才會出現「結案」。' : ''}\x3C/p>
    \x3Cdiv class="choices">${acts.map(a => `\x3Cbutton class="choice${a.danger ? ' danger' : ''}" data-choice="${esc(a.key)}" aria-pressed="false">${esc(a.label)}\x3C/button>`).join('')}\x3C/div>
    \x3Cdiv class="actform" id="actform" hidden>\x3C/div>\x3C/div>`;
}
function bindNextStep(c, d){
  const form = document.getElementById('actform'); if(!form) return;
  const acts = visibleActions(d);
  $app.querySelectorAll('[data-choice]').forEach(btn => btn.onclick = () => {
    $app.querySelectorAll('[data-choice]').forEach(b => b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'));
    const a = acts.find(x => x.key === btn.dataset.choice);
    const store = a.role === '門市';
    form.hidden = false;
    form.innerHTML = `${a.fields.map((f, i) => `\x3Clabel class="f" for="nf${i}">${esc(f.label)}\x3C/label>${f.multiline ? `\x3Ctextarea id="nf${i}">\x3C/textarea>` : `\x3Cinput type="text" id="nf${i}">`}`).join('')}
      ${store ? `\x3Clabel class="f" for="ncode">你的人員代碼\x3C/label>\x3Cinput type="text" id="ncode" autocomplete="off" autocapitalize="characters" style="max-width:200px">` : ''}
      \x3Cdiv class="err-text" id="nerr2">\x3C/div>
      \x3Cbutton class="btn ${a.danger ? 'danger' : 'primary'} block" id="nsend" style="margin-top:12px">送出：${esc(a.label)}\x3C/button>`;
    const first = form.querySelector('textarea,input'); if(first) first.focus();
    document.getElementById('nsend').onclick = async () => {
      const err = document.getElementById('nerr2'); err.textContent = '';
      const values = {};
      for(let i = 0; i < a.fields.length; i++){
        const v = document.getElementById('nf' + i).value.trim();
        if(a.fields[i].required && !v){ err.textContent = `請填寫「${a.fields[i].label}」`; return; }
        values[a.fields[i].key] = v;
      }
      const code = store ? document.getElementById('ncode').value.trim() : '';
      if(store && !code){ err.textContent = '請輸入你的人員代碼'; return; }
      if(a.danger && !confirm(`確定要${a.label}嗎？`)) return;
      busy('送出中…');
      try {
        await call('doAction', c.id, a.key, values, code, '', store ? '' : S.lead.token);
        busy(); toast(`已送出：${a.label}`); openCase(c.id);
      } catch(e){ busy(); err.textContent = e.message; }
    };
  });
}

/* ---------- 啟動 ---------- */
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
if(DEEP_CASE) openCase(DEEP_CASE); else openHome();
</script>
